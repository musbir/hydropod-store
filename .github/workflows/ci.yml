name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 requires >= 20.9; keep this in step with engines.node.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Validate imported catalog
        run: python scripts/validate_catalog.py

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Smoke test the running app
        env:
          ADMIN_TOKEN: ci-smoke-token
        run: |
          npm start &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT

          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 2
          done

          echo "--- health ---"
          curl -sf http://localhost:3000/api/health | tee /tmp/health.json
          test "$(jq -r .status /tmp/health.json)" = "ok"
          test "$(jq -r .catalog.products /tmp/health.json)" -gt 0

          echo "--- storefront routes ---"
          for path in / /catalog /supplier /cart /checkout /robots.txt /sitemap.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "  $path -> $code"
            test "$code" = "200"
          done

          echo "--- a product page renders ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/product/HP-SFT-AMBER)
          test "$code" = "200"

          echo "--- admin is closed without a token ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/admin/products)
          test "$code" = "401"

          echo "--- admin opens with the token ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "x-admin-token: ci-smoke-token" http://localhost:3000/api/admin/products)
          test "$code" = "200"
